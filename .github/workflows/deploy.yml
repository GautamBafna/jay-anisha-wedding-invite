   - name: Show build output
      run: |
         echo "=== top level ==="
          ls -la
          echo "=== all built files (not node_modules) ==="
          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./src/*" | head -60
          echo "=== dist ==="
          find dist -maxdepth 3 | head -40
          echo "=== .output ==="
          find .output -maxdepth 3 2>/dev/null | head -40
          exit 1
    - uses: actions/upload-pages-artifact@v3
      with:
          path: ${{ env.OUT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
