name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Show build output
        run: |
          echo "=== top level ==="
          ls -la
          echo "=== built files ==="
          find . -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" \) -not -path "./node_modules/*" -not -path "./.git/*" -not -path "./src/*" | head -60
          echo "=== dist ==="
          find dist -maxdepth 3 | head -40
          echo "=== .output ==="
          find .output -maxdepth 3 2>/dev/null | head -40
          exit 1
